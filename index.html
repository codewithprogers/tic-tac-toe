<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Project</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="layout-container">
      <header>
        <h1 id="game-title">Tic-Tac-Toe</h1>
        <div class="scoreboard">
          <div class="x-score">X</div>
          <div class="turn">X's Turn</div>
          <div class="o-score">O</div>
        </div>
      </header>

      <main>
        <div class="game-board">
          <button class="game-cell" data-row="0" data-column="0"></button>
          <button class="game-cell" data-row="0" data-column="1"></button>
          <button class="game-cell" data-row="0" data-column="2"></button>

          <button class="game-cell" data-row="1" data-column="0"></button>
          <button class="game-cell" data-row="1" data-column="1"></button>
          <button class="game-cell" data-row="1" data-column="2"></button>

          <button class="game-cell" data-row="2" data-column="0"></button>
          <button class="game-cell" data-row="2" data-column="1"></button>
          <button class="game-cell" data-row="2" data-column="2"></button>
        </div>
      </main>

      <footer>
        <button class="restart-button">Restart</button>
      </footer>
    </div>
  </body>
</html>
